name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ponotai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ponotai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ponotai_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ponotai_test?schema=public
      TEST_PERSISTENCE_MODE: postgres
      JWT_SECRET: test-secret
      AUTH_BYPASS_EMAIL_VERIFICATION: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --include=dev
      - run: npm run prisma:generate
      - run: npx prisma validate --schema prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
